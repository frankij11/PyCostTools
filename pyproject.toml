[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycost"
dynamic = ["version"]
description = "Python tools for cost estimation and analysis"
readme = "README.md"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Kevin Joy", email = "kevinfjoy@gmail.com"},
]
maintainers = [
    {name = "Kevin Joy", email = "kevinfjoy@gmail.com"},
]
keywords = ["cost estimation", "learning curves", "inflation", "financial analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "param>=1.12.0",
    "panel>=0.14.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "holoviews>=1.15.0",
    "hvplot>=0.7.0",
    "patsy",
    "seaborn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.5b2",
    "flake8>=3.9.2",
    "mypy>=0.812",
    "sphinx>=4.0.2",
    "sphinx-rtd-theme>=0.5.2",
    "build>=0.8.0",
    "twine>=4.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipykernel>=6.0.0",
]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/frankij11/PyCostTools"
Documentation = "https://github.com/frankij11/PyCostTools"
Repository = "https://github.com/frankij11/PyCostTools"
"Bug Tracker" = "https://github.com/frankij11/PyCostTools/issues"
Changelog = "https://github.com/frankij11/PyCostTools/blob/main/CHANGES.md"

[tool.setuptools.dynamic]
version = {attr = "pycost.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
pycost = ["data/*", "py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pycost"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "panel.*",
    "param.*",
    "holoviews.*",
    "hvplot.*",
    "patsy.*",
    "networkx.*",
]
ignore_missing_imports = true 