[tox]
envlist = py38,py39,py310,py311,py312,flake8,mypy,docs
isolated_build = true

[testenv]
deps = 
    pytest>=6.0.0
    pytest-cov>=2.12.0
    pytest-xdist>=2.0.0
commands = 
    pytest tests/ -v --cov=pycost --cov-report=term-missing --cov-report=xml

[testenv:flake8]
deps = flake8>=3.9.2
commands = flake8 pycost tests examples

[testenv:mypy]
deps = 
    mypy>=0.812
    types-setuptools
commands = mypy pycost

[testenv:black]
deps = black>=21.5b2
commands = black --check pycost tests examples

[testenv:black-format]
deps = black>=21.5b2
commands = black pycost tests examples

[testenv:docs]
deps = 
    sphinx>=4.0.2
    sphinx-rtd-theme>=0.5.2
commands = 
    sphinx-build -W -b html docs docs/_build/html

[testenv:examples]
commands = python test_examples.py

[testenv:build]
deps = 
    build>=0.8.0
    twine>=4.0.0
commands = 
    python -m build
    twine check dist/*

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .tox,
    .eggs,
    *.egg,
    build,
    dist,
    .venv,
    venv

[coverage:run]
source = pycost
omit = 
    */tests/*
    */examples/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod 